<div id="ArticleInfoHeader" class="Frame">
  <div id="ArticleTitleGroup">
    <div class="row">
      <div>Title:</div><h1 id="Title"><a></a></h1>
    </div>
    <div class="row">
      <div>Id:</div>
      <a id="ArticleId"></a>
    </div>
  </div>
  <div>by</div>
  <img id="AuthorPicture" />
  <div id="AuthorNickAndCreationTime">
    <a id="AuthorNick" class="row"></a>
    <div class="row">
      <div>on</div>
      <div id="CreationTime"></div>
    </div>
  </div>
  <div id="ArticleSummary"></div>
</div>
<div id="ArticleSettingsHeader" class="Frame">
  <label for="ContentTypeSelect">Content type:</label>
  <select name="ContentTypeSelect" id="ContentTypeSelect">
    <option value="plain">Plain text</option>
    <option value="djot">Djot</option>
    <option value="asciidoc">Asciidoc</option>
  </select>
  <label for="article">Article</label>
  <input type="radio" name="ViewType" value="article" checked/>
  <label for="event">Event</label>
  <input type="radio" name="ViewType" value="event"/>
</div>
<div id='ArticleView' class="Frame">
  <article id="ArticleContentView" class="Scrollable"></article>
  <div id="ArticleTagsView" class="Frame">
    Tags
  </div>
  <div id="ArticleRelaysView"></div>
</div>
<div id='RawEventView' style="display: none"  class="Scrollable"></div>
<div id="RawArticleContent" style="display: none"></div>
