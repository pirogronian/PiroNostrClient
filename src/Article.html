<div id="ArticleInfo"></div>
<div id="ArticleSettingsHeader">
  <label for="ContentTypeSelect">Format:</label>
  <select name="ContentTypeSelect" id="ContentTypeSelect">
    <option value="plain">Plain text</option>
    <option value="djot">Djot</option>
    <option value="asciidoc">Asciidoc</option>
  </select>
  <label for="uselastformat">Remember</label>
  <input type="checkbox" name="uselastformat"/>
  <label for="article" class="active">Article:<input type="radio" name="ViewType" value="article" checked/></label>
  <label for="event" class="active">Event:<input type="radio" name="ViewType" value="event"/></label>
</div>
<div id='ArticleView' class="Frame">
  <article id="ArticleContentView" class="Scrollable"></article>
  <div id="ArticleRelaysView"></div>
</div>
<div id='RawEventView' style="display: none"  class="Scrollable"></div>
<div id="RawArticleContent" style="display: none"></div>
