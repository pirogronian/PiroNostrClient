<div class="RelayItem">
<div class="RelayHead">
<div class="RelayHeadMain">
    <a class="RelayUrl"></a>
    <div class="RelayStatus"></div>
    <div class="New" style="display: none;">New</div>
    <div class="Challenge" title="Relay challenge"></div>
    <div class="Notice" title="Relay notice"></div>
    <button type="button" class="RelayInfoButton" disabled>Info</button>
    <button type="button" class="RelaySettingsButton">Settings</button>
    <button type="button" class="ConnectRelayButton">Connect</button>
    <button type="button" class="DisconnectRelayButton">Disconnect</button>
    <!--<button type="button" class="UseRelayButton">Use</button>
    <button type="button" class="DontUseRelayButton">Don't use</button>-->
    <button type="button" class="AddRelayButton">Add</button>
    <button type="button" class="RemoveRelayButton">Remove</button>
    <button type="button" class="ForgetRelayButton">Forget</button>
</div>
<div class="RelayHeadMore">
    <span class="Begin"></span>
    <label class="RelayRead Active">Read:
        <input type="checkbox" class="RelayRead"/>
    </label>
    <label class="RelayWrite Active">Read:
        <input type="checkbox" class="RelayWrite"/>
    </label>
    <label class="RelayBootstrap Active">Bootstrap:
        <input type="checkbox" class="RelayBootstrap"/>
    </label>
    <label class="RelayTrusted Active">Trusted:
        <input type="checkbox" class="RelayTrusted"/>
    </label>
    <label class="RelayAuth">
        On auth:
        <select class="RelayAuth">
            <option value="none">None</option>
            <option value="disconnect">Disconnect</option>
            <option value="signin">Sign in</option>
        </select>
    </label>
</div>
</div>
</div>
