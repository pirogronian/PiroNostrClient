<div id="ArticleEditor">
    <div id="ArticlePreview"></div>
    <div id="ArticleEditBar">
        <button type="button" id="ArticleDraftButton">Save draft</button>
        <button type="button" id="ArticleDraftNewButton">New draft</button>
        <span id="ArticleDraftStatus">Unsaved</span>
        <button type="button" id="ArticlePreviewButton">Preview</button>
        <button type="button" id="ArticlePublishButton">Publish</button>
        <label>Raw event:<input type="checkbox" id="RawEventCheckbox"/></label>
        <label class="Active">Content only:<input type="checkbox" id="ArticleEditContentCheckbox"/></label>
        <label class="Active">Hide toolbar:<input type="checkbox" id="ArticleEditToolbarCheckbox"/></label>
        <label class="Active">Safe mode:<input type="checkbox" id="ArticleEditSafeModeCheckbox"/></label>
    </div>
    <div id="ArticleEdit">
        <div id="ArticleEditTagStuff">
            <label for="ArticleTitle">Title:<input type="text" name="ArticleTitle"/></label>
            <label for="ArticleId" id="ArticleId">Id:<input type="text" name="ArticleId"/></label>
            <label for="ArticleFormat">Format:
                <input type="text" name="ArticleFormat" id="ArticleFormat"/>
                <select name="ArticleFormatSelect">
                    <option value="">Select</option>
                    <option value="plaintext">Plain text</option>
                    <option value="djot">DJot</option>
                    <option value="asciidoc">Asciidoc</option>
                </select>
            </label>
            <label class="Active">Remember format:<input type="checkbox" id="ArticleRememberFormat"/></label>
            <label for="ArticlePublishedAt">Published at:<input type="datetime-local" name="ArticlePublishedAt"/></label>
            <div class="Frame">
                <label for="ArticleTopic">Topic:<input type="text" name="ArticleTopic"/><button type="button">Add</button></label>
                <label for="ArticleCategory">Category:<input type="text" name="ArticleCategory"/><button type="button">Add</button></label>
                <label for="ArticleLanguage">Language:<input type="text" name="ArticleLanguage" list="AllLanguagesList"/><button type="button">Add</button></label>
            </div>
            <datalist id="AllLanguagesList"></datalist>
            <fieldset id="NewTag">
                <legend>New tag:</legend>
                <span>
                    <input type="text" value="TagName"/>
                    <input type="text" value="TagValue"/>
                    <input type="text" value="TagMarker"/>
                </span>
                <button id="AddTagFieldButton">Add field</button>
                <button id="RemoveTagFieldButton">Remove field</button>
                <button id="AddTagButton">Add tag</button>
            </fieldset>
            <fieldset id="Topics"><legend>Topics:</legend></fieldset>
            <fieldset id="Categories"><legend>Categories:</legend></fieldset>
            <fieldset id="Languages"><legend>Languages:</legend></fieldset>
            <fieldset id="Tags"><legend>Tags:</legend></fieldset>
            <h3>Summary:</h3>
            <textarea id="ArticleSummary"></textarea>
        </div>
        <h3 id="ArticleEditContentHeading">Content:</h3>
        <div id="CodeMirrorToolbar">
            <button id="CodeMirrorUndoButton">Undo</button>
            <button id="CodeMirrorRedoButton">Redo</button>
            <select id="CodeMirrorDjotText" class="djot">
                <option value="-">Text:</option>
                <option value="verb">Verb</option>
                <option value="emph">Emph</option>
                <option value="strong">Strong</option>
                <option value="high">High</option>
                <option value="sup">Sup</option>
                <option value="sub">Sub</option>
                <option value="ins">Ins</option>
                <option value="del">Del</option>
            </select>
            <select id="CodeMirrorDjotQuote" class="djot">
                <option value="-">Quote:</option>
                <option value="1">Single</option>
                <option value="2">Double</option>
                <option value="bl">Block</option>
            </select>
            <select id="CodeMirrorDjotInsertNew" class="djot">
                <option value="-">Insert:</option>
                <option value="ellipse">...</option>
                <option value="ndash">En-dash</option>
                <option value="mdash">Em-dash</option>
                <option value="break">Break</option>
                <option value="parag">Paragraph</option>
            </select>
            <select id="CodeMirrorDjotMath" class="djot">
                <option value="-">Math:</option>
                <option value="inline">Inline</option>
                <option value="block">Block</option>
            </select>
            <select id="CodeMirrorDjotFootnote" class="djot">
                <option value="-">Footn:</option>
                <option value="ref">Ref.</option>
                <option value="def">Def.</option>
            </select>
            <select id="CodeMirrorDjotLinkSelector" class="djot">
                <option value="-">Link:</option>
                <option id="CodeMirrorDjotLink">Direct link</option>
                <option id="CodeMirrorDjotRefLink">Ref. link</option>
                <option id="CodeMirrorDjotLinkRef">Link ref.</option>
                <option id="CodeMirrorDjotAutolink">Autolink</option>
            </select>
            <dialog id="CodeMirrorDjotLinkDialog">
                <label>Label:<input type="text" id="CodeMirrorDjotLinkDialogLabel"/></label>
                <label>Target:<input type="text" id="CodeMirrorDjotLinkDialogTarget"/></label>
                <button id="CodeMirrorDjotLinkDialogCancel">Cancel</button>
                <button id="CodeMirrorDjotLinkDialogInsert">Insert</button>
            </dialog>
            <dialog id="CodeMirrorDjotRefLinkDialog">
                <label>Label:<input type="text" id="CodeMirrorDjotRefLinkDialogLabel"/></label>
                <label>Reference:<input type="text" id="CodeMirrorDjotRefLinkDialogRef"/></label>
                <button id="CodeMirrorDjotRefLinkDialogCancel">Cancel</button>
                <button id="CodeMirrorDjotRefLinkDialogInsert">Insert</button>
            </dialog>
            <dialog id="CodeMirrorDjotLinkRefDialog">
                <label>Reference:<input type="text" id="CodeMirrorDjotLinkRefDialogRef"/></label>
                <label>Target:<input type="text" id="CodeMirrorDjotLinkRefDialogTarget"/></label>
                <button id="CodeMirrorDjotLinkRefDialogCancel">Cancel</button>
                <button id="CodeMirrorDjotLinkRefDialogInsert">Insert</button>
            </dialog>
            <select id="CodeMirrorDjotImageSelector" class="djot">
                <option value="-">Images:</option>
                <option id="CodeMirrorDjotImage">Image</option>
                <option id="CodeMirrorDjotRefImage">Ref. image</option>
            </select>
            <dialog id="CodeMirrorDjotImageDialog">
                <label>Label:<input type="text" id="CodeMirrorDjotImageDialogLabel"/></label>
                <label>Target:<input type="text" id="CodeMirrorDjotImageDialogTarget"/></label>
                <button id="CodeMirrorDjotImageDialogCancel">Cancel</button>
                <button id="CodeMirrorDjotImageDialogInsert">Insert</button>
            </dialog>
            <dialog id="CodeMirrorDjotRefImageDialog">
                <label>Label:<input type="text" id="CodeMirrorDjotRefImageDialogLabel"/></label>
                <label>Reference:<input type="text" id="CodeMirrorDjotRefImageDialogRef"/></label>
                <button id="CodeMirrorDjotRefImageDialogCancel">Cancel</button>
                <button id="CodeMirrorDjotRefImageDialogInsert">Insert</button>
            </dialog>
            <select id="CodeMirrorDjotHeading" class="djot">
                <option>Heading</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
            </select>
            <span class="djot">Comprehensive instructions of using Djot are <a href="https://htmlpreview.github.io/?https://github.com/jgm/djot/blob/master/doc/syntax.html" target="_blank">on this page</a>.</span>
        </div>
        <div id="CodeMirrorContainer"></div>
    </div>
    <textarea id="ArticleEditRawEvent" style="display: none;"></textarea>
</div>
