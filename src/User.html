<div id="Login" class="Frame">
  <label for="LoginMethod">Login with:</label>
  <select name="LoginMethod" id="LoginMethodSelect">
    <option value="">None</option>
    <option value="nip07">NIP-07</option>
    <option value="nip46">NIP-46</option>
  </select>
  <div id="UserLoginNIP46" style="display: none">
    <div>Provide bunker url here or provide url to your remote signer or scan qr code.</div>
    <label for="UserLoginNIP46BunkerUrl">Bunker url:
      <input type="text" name="UserLoginNIP46BunkerUrl"/>
      <button type="button">Enter</button>
    </label>
    <div id="UserLoginNIP46NostrconnectURI"></div>
    <canvas id="UserLoginNIP46QrCode"></canvas>
    <button type="button" id="UserLoginNIP46Cancel">Cancel</button>
  </div>
  <div id="UserLoginNIP46Restore" style="display: none">
    <div>Restoring NIP-46 session. Please wait.</div>
    <button id="UserLoginNIP46Forget">Forget</button>
  </div>
</div>
<div id="UserProfile">
  <table class="Info">
    <tbody>
      <tr><td>Public key:</td><td id="UserPubkey" title="Click to copy"></td></tr>
      <tr><td>NPub:</td><td id="UserNPub" title="Click to copy"></td></tr>
      <tr><td>NProfile:</td><td id="UserNProfile" title="Click to copy"></td></tr>
      <tr><td>Created at:</td><td id="UserCreatedAt"></td></tr>
      <tr><td>Name:</td><td id="UserName"></td></tr>
      <tr><td>Display name:</td><td id="UserDisplayName"></td></tr>
      <tr><td>Picture:</td><td id="UserPicture"><img/></td></tr>
      <tr><td>Banner:</td><td id="UserBanner"><img/></td></tr>
      <tr><td>Bio:</td><td id="UserBio"></td></tr>
      <tr>
        <td>NIP-05:</td>
        <td>
          <span id="UserNip05" title="Click to copy"></span>
          <span class="Valid" style="display: none">✓</span>
          <span class="Invalid" style="display: none">!</span>
        </td>
      </tr>
      <tr><td>LUD-06:</td><td id="UserLud06"></td></tr>
      <tr><td>LUD-16:</td><td id="UserLud16" title="Click to copy"></td></tr>
      <tr><td>About:</td><td id="UserAbout"></td></tr>
      <tr><td>Website:</td><td id="UserWebsite"><a></a></td></tr>
    </tbody>
  </table>
  <button type="button" id="Logout" style="display: none">Logout</button>
</div>
<a id="UserArticlesLink" style="display: none">User's articles</a>
<div>User's read relays:</div>
<div id="UserReadRelays"></div>
<div>User's write relays:</div>
<div id="UserWriteRelays"></div>
