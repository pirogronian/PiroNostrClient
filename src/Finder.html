<div>Search articles</div>
<form id="FinderForm">
    <label for="id">Id:</label>
    <input type="text" name="id" id="FinderId"/>
    <label for="id">Author:</label>
    <input type="text" name="author" id="FinderAuthor"/>
    <label for="since">Since:</label>
    <input type="text" name="since" id="FinderSince"/>
    <label for="until">Until:</label>
    <input type="text" name="until" id="FinderUntil"/>
    <label for="limit">Limit:</label>
    <input type="text" name="limit" id="FinderLimit"/>
    <div id="FinderFormTags">
        <label for="tag">Tag:</label>
        <input type="text" name="tag"/>
        <label for="tagvalue">Value:</label>
        <input type="text" name="tagvalue"/>
        <button type="button" id="AddSearchTag">Add</button>
    </div>
    <input type="submit" value="Search" id="FinderSubmit"/>
</form>
<div id="FinderResult" class="Scrollable"></div>
