<div>Search for articles or <label for="address">enter address:<input type="text" name="address" id="ArticleAddress"/><button id="ArticleAddressGo">go</button></label> or <button type="button" id="CreateNewButton">create new</button></div>
<form id="FinderForm" action="#" class="FlexContainer">
    <input type="hidden" name="Search" value="1"/>
    <label for="id">Id:<input type="text" name="id" id="FinderId"/></label>
    <label for="id">Author:<input type="text" name="author" id="FinderAuthor"/></label>
    <button type="button" id="FinderAuthorMe">Me</button>
    <label for="content">Content:<textarea name="content" id="FinderContent"></textarea></label>
    <label for="since">Since:<input type="datetime-local" name="since" id="FinderSince"/></label>
    <label for="until">Until:<input type="datetime-local" name="until" id="FinderUntil"/></label>
    <label for="limit">Limit:<input type="text" name="limit" id="FinderLimit"/></label>
    <div id="FinderFormTags">
        <label for="tag">Tag:<input type="text" name="tag"/></label>
        <label for="tagvalue">Value:<input type="text" name="tagvalue"/></label>
        <button type="button" id="AddSearchTag">Add</button>
    </div>
    <label>Relays
        <select name="relaysTag" id="FinderRelaysTag">
            <option value="">(All)</option>
        </select>
    </label>
    <input type="submit" value="Search" id="FinderSubmit"/>
    <div id="FinderResultsInfo"><div id="FinderResultsNumber"></div></div>
</form>
<div class="FlexContainer">
    <label for="ArticlesOrderField">Sort by
        <select name="ArticlesOrderField" id="ArticlesOrderField">
            <option value="title">Title</option>
            <option value="content">Content</option>
            <option value="creationTime">Creation</option>
            <option value="publicationTime">Publication</option>
        </select>
    </label>
    <label>Asc:<input type="radio" name="ArticlesOrder" id="ArticlesOrderAsc" value="asc"/></label>
    <label>Desc:<input type="radio" name="ArticlesOrder" value="desc"/></label>
    <button id="ArticlesSortButton">Sort</button>
    <label>Filter by:<input type="text" id="ArticlesFilterText"/></label>
    <label>Content:<input type="checkbox" id="ArticlesFilterContent"></label>
    <label>Title:<input type="checkbox" id="ArticlesFilterTitle"></label>
    <label>Tag name:<input type="checkbox" id="ArticlesFilterTagName"></label>
    <label>Tag value:<input type="checkbox" id="ArticlesFilterTagValue"></label>
    <label>Case sens.:<input type="checkbox" id="ArticlesFilterCase"></label>
    <button id="ArticlesFilterButton">Filter</button>
</div>
<div id="FinderResult" class="Scrollable"></div>
