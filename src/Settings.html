<div id="Settings">
  <div id="Login" class="Frame">
    <label for="LoginMethod">Login with:</label>
    <select name="LoginMethod" id="LoginMethodSelect">
      <option value="">None</option>
      <option value="nip07">NIP-07</option>
    </select>
  </div>
  <div id="LoggedUser">
    <div>Logged user:</div>
    <dl>
      <dt>Nick:</dt>
      <dd id="LoggedUserNick"></dd>
      <dt>Pubkey:</dt>
      <dd id="LoggedUserPubkey"></dd>
    </dl>
    <button type="button" id="Logout">Logout</button>
  </div>
  <div class="Frame">
    <div id="ActiveRelaysHeader">
      <div>Active relays:</div>
      <label for="NewRelayUrl">Url:
        <input type="text" name="NewRelayUrl"/>
        <button type="button" id="AddRelayButton">Add</button>
      </label>
      <button type="button" id="RefreshActiveRelays">Refresh</button>
    </div>
    <div id="ActiveRelays" class="Scrollable"></div>
  </div>
</div>
