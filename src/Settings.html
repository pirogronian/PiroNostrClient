<div id="Settings">
  <div id="Login" class="Frame">
    <label for="LoginMethod">Login with:</label>
    <select name="LoginMethod" id="LoginMethodSelect">
      <option value="">None</option>
      <option value="nip07">NIP-07</option>
    </select>
  </div>
  <div id="LoggedUser">
    <div>Logged user:</div>
    <dl>
      <dt>Nick:</dt>
      <dd id="LoggedUserNick"></dd>
      <dt>Pubkey:</dt>
      <dd id="LoggedUserPubkey"></dd>
    </dl>
    <button type="button" id="Logout">Logout</button>
  </div>
  <div class="Frame">
    <div>Active relays:</div>
    <ul id="RelaysList"></ul>
  </div>
</div>
